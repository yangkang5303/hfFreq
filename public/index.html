<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="HFCC B26 季全球短波广播频率查询：按 UTC 时间、语言、电台筛选当前可收听的频率，并在世界地图上查看发射方位与功率。">
<meta name="theme-color" content="#0f1419">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%BB%3C/text%3E%3C/svg%3E">
<title>HF 短波频率查询 · B26</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a2129; --panel2:#212a34; --border:#2d3947;
    --text:#e6edf3; --muted:#8b98a5; --accent:#3fb950; --accent2:#58a6ff;
    --warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#141b22,#1a2129);
    border-bottom:1px solid var(--border);padding:14px 18px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
  h1{margin:0 0 2px;font-size:19px;font-weight:600}
  h1 .tag{font-size:12px;font-weight:500;color:var(--accent);border:1px solid var(--accent);
    border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:middle}
  .headtop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .headbtns{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rptlink{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
    background:var(--panel);border:1px solid var(--border);border-radius:7px;
    padding:6px 11px;color:var(--text);font-size:12.5px;white-space:nowrap;transition:.15s}
  .rptlink:hover{border-color:var(--accent2);color:var(--accent2)}
  #collapsebtn{width:34px;height:34px;padding:0;font-size:13px;line-height:1}
  /* 收起面板时只保留中/英文快捷按钮 */
  body.top-hidden header .controls > :not(.langtoggles),
  body.top-hidden .tabs,
  body.top-hidden .chips{display:none!important}
  body.top-hidden header .controls{margin-top:8px}
  .nowchk{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px;
    cursor:pointer;user-select:none;white-space:nowrap}
  .nowchk input{accent-color:var(--accent);width:15px;height:15px}
  input:disabled{opacity:.5;cursor:not-allowed}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
  input,select,button{font:inherit;background:var(--panel);color:var(--text);
    border:1px solid var(--border);border-radius:7px;padding:7px 10px;outline:none}
  input:focus,select:focus{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(88,166,255,.2)}
  #q{flex:0 1 260px;min-width:0}
  .ctrl-grp{display:flex;align-items:center;gap:6px;background:var(--panel);
    border:1px solid var(--border);border-radius:7px;padding:4px 8px}
  .ctrl-grp label{color:var(--muted);font-size:12px;white-space:nowrap}
  .ctrl-grp input[type=number]{width:64px;background:var(--panel2);padding:3px 6px}
  button{cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent2)}
  button.primary{background:var(--accent);color:#06210f;border-color:var(--accent);font-weight:600}
  button.primary:hover{filter:brightness(1.1)}
  button.on{background:var(--accent2);color:#04121f;border-color:var(--accent2);font-weight:600}
  .langtoggles{display:flex;align-items:center;gap:0;background:var(--panel);
    border:1px solid var(--border);border-radius:7px;overflow:hidden;padding:0}
  .langtoggles button{border:0;border-radius:0;background:transparent;padding:7px 12px;
    color:var(--muted);font-size:13px;white-space:nowrap}
  .langtoggles button + button{border-left:1px solid var(--border)}
  .langtoggles button.on{background:var(--accent2);color:#04121f;font-weight:600}
  .stats{color:var(--muted);font-size:12.5px;display:flex;gap:4px 16px;flex-wrap:wrap}
  .stats b{color:var(--text)}
  main{padding:16px 18px 12px}
  footer{border-top:1px solid var(--border);padding:12px 18px calc(14px + env(safe-area-inset-bottom, 0px));
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;
    color:var(--muted);font-size:12.5px}
  .footlinks{display:flex;gap:14px;flex-wrap:wrap}
  footer a{color:var(--accent2);text-decoration:none}
  footer a:hover{text-decoration:underline}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{background:var(--panel);border:1px solid var(--border);border-radius:999px;
    padding:3px 11px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--accent)}
  .bandgroup{margin-bottom:22px}
  .bandgroup h2{font-size:14px;margin:0 0 8px;color:var(--accent2);font-weight:600;
    display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;
    border-radius:6px;padding:2px 4px;transition:background .12s}
  .bandgroup h2:hover{background:var(--panel2)}
  .bandgroup h2 .cnt{font-size:11px;color:var(--muted);font-weight:400}
  .bandgroup h2 .chev{display:inline-block;width:12px;color:var(--muted);
    font-size:11px;flex:0 0 auto;transition:transform .15s}
  .bandgroup.collapsed h2{margin-bottom:0}
  .bandgroup.collapsed table{display:none}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:9px;overflow:hidden}
  thead th{background:var(--panel2);color:var(--muted);font-size:11.5px;text-transform:uppercase;
    letter-spacing:.4px;padding:8px 9px;text-align:left;position:sticky;top:0;
    border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:7px 9px;border-bottom:1px solid rgba(45,57,71,.55);vertical-align:top}
  tbody tr:hover{background:var(--panel2)}
  .freq{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
  .time{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text)}
  .lang{white-space:nowrap}
  .lang small{color:var(--muted)}
  .brc{white-space:nowrap}
  .brc small{display:block;color:var(--muted);font-size:11px}
  .site small{display:block;color:var(--muted);font-size:11px}
  .badge{display:inline-block;font-size:10.5px;border-radius:4px;padding:1px 6px;margin-left:5px}
  .b-now{background:rgba(63,185,80,.18);color:var(--accent);border:1px solid rgba(63,185,80,.5)}
  .b-mod{background:rgba(210,153,34,.15);color:var(--warn);border:1px solid rgba(210,153,34,.4)}
  .b-drm{background:rgba(88,166,255,.15);color:var(--accent2);border:1px solid rgba(88,166,255,.4)}
  .notes{color:var(--muted);font-size:12px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty .big{font-size:40px;margin-bottom:10px}
  .nowtog{display:flex;align-items:center;gap:6px}
  .nowtog input{accent-color:var(--accent)}

  /* ---- view tabs ---- */
  .tabs{display:flex;gap:6px;margin:0 0 12px}
  .tabs button{background:var(--panel);border:1px solid var(--border);color:var(--muted);
    padding:6px 16px;border-radius:7px;font-size:13px}
  .tabs button.active{background:var(--accent2);border-color:var(--accent2);color:#04121f;font-weight:600}

  /* ---- map ---- */
  .mapwrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    overflow:hidden;position:relative}
  #map{display:block;width:100%;height:auto;cursor:grab;touch-action:none}
  #map.dragging{cursor:grabbing}
  .mapctrl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
  .mapctrl button{width:34px;height:34px;padding:0;font-size:16px;line-height:1;
    background:rgba(26,33,41,.9);backdrop-filter:blur(4px)}
  .maplegend{position:absolute;left:12px;bottom:12px;z-index:5;
    background:rgba(15,20,25,.82);backdrop-filter:blur(6px);border:1px solid var(--border);
    border-radius:8px;padding:10px 13px;font-size:11.5px;color:var(--muted);max-width:270px}
  .maplegend .row{display:flex;align-items:center;gap:8px;margin:3px 0}
  .maplegend .row svg{flex:0 0 auto}
  .maplegend b{color:var(--text);font-weight:600}
  .maplegend .hint{margin-top:6px;font-size:11px;color:#6b7684;line-height:1.45}
  .maptip{position:absolute;z-index:9;pointer-events:none;
    max-width:calc(100vw - 24px);
    background:rgba(15,20,25,.97);border:1px solid var(--accent2);border-radius:8px;
    padding:10px 14px;font-size:12px;color:var(--text);box-shadow:0 6px 24px rgba(0,0,0,.6);
    opacity:0;transition:opacity .1s;white-space:nowrap}
  .maptip.show{opacity:1}
  .maptip .t-site{font-weight:700;color:var(--accent2);margin-bottom:3px;white-space:nowrap}
  .maptip .t-meta{color:var(--muted);font-size:11px;margin-bottom:6px;white-space:nowrap}
  .maptip .t-freq{font-weight:700;color:var(--accent)}
  .maptip table{background:none;border:0;border-collapse:collapse;width:max-content;max-width:none}
  .maptip td{padding:1px 10px 1px 0;font-size:11.5px;border:0;white-space:nowrap}
  .maptip th{white-space:nowrap;padding:0 10px 3px 0;font-size:10.5px;color:var(--muted);
    font-weight:600;text-align:left;border-bottom:1px solid var(--border);text-transform:none;letter-spacing:0}
  .maptip td:last-child,.maptip th:last-child{padding-right:0}
  .maptip td.k{color:var(--muted);white-space:nowrap}
  .maptip .more{color:var(--muted);font-size:11px;margin-top:4px;white-space:nowrap}

  /* ---- 接收点（拖动 📻 到地图） ---- */
  #probebtn{font-size:17px;touch-action:none;cursor:grab}
  .probe-ghost{position:fixed;z-index:1000;pointer-events:none;font-size:30px;line-height:1;
    transform:translate(-50%,-115%);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));opacity:0}
  .probe-ghost.show{opacity:1}
  .probe-ghost::after{content:"";position:absolute;left:50%;bottom:-9px;width:8px;height:8px;margin-left:-4px;
    border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px rgba(88,166,255,.35)}
  .probepanel{position:absolute;z-index:6;top:10px;left:10px;width:min(370px,calc(100% - 64px));
    max-height:calc(100% - 20px);display:flex;flex-direction:column;
    background:rgba(15,20,25,.95);backdrop-filter:blur(6px);border:1px solid var(--accent2);border-radius:9px;
    box-shadow:0 6px 24px rgba(0,0,0,.55);font-size:12px}
  .probepanel[hidden]{display:none}
  .pp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
    padding:9px 10px 7px 12px;border-bottom:1px solid var(--border)}
  .pp-title{font-weight:700;color:var(--accent2)}
  .pp-meta{color:var(--muted);font-size:11px}
  .pp-meta b{color:var(--text)}
  .pp-close{width:26px;height:26px;padding:0;font-size:12px;line-height:1;flex:0 0 auto}
  .pp-list{overflow-y:auto;flex:1 1 auto;min-height:0}
  .pp-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:9px;align-items:center;
    padding:5px 12px;border-bottom:1px solid rgba(45,57,71,.5)}
  .pp-bars{display:inline-flex;gap:2px;align-items:flex-end}
  .pp-bars i{width:3px;background:#2d3947;border-radius:1px}
  .pp-bars i:nth-child(1){height:5px} .pp-bars i:nth-child(2){height:7px} .pp-bars i:nth-child(3){height:9px}
  .pp-bars i:nth-child(4){height:11px} .pp-bars i:nth-child(5){height:13px}
  .pp-freq{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pp-freq small{color:var(--muted);font-weight:400;font-size:10px}
  .pp-main b,.pp-main small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pp-main b{font-weight:600}
  .pp-main small,.pp-side small{color:var(--muted);font-size:10.5px}
  .pp-side{text-align:right;white-space:nowrap}
  .pp-side small{display:block}
  .pp-empty,.pp-more{color:var(--muted);padding:10px 12px}
  .pp-note{color:#6b7684;font-size:10.5px;padding:6px 12px 8px;border-top:1px solid var(--border)}

  @media(max-width:820px){
    .col-pow,.col-az,.col-ant,.col-days,.col-date,.col-ciraf{display:none}
    #q{flex:1 1 150px}
    header{padding:9px 11px}
    h1{font-size:16px}
    main{padding:8px 8px 10px}
    footer{padding:10px 11px calc(12px + env(safe-area-inset-bottom, 0px))}
    .rptlink{padding:5px 8px;font-size:12px}
    .mapwrap{border-radius:8px}
    .probepanel{top:auto;bottom:8px;left:8px;width:calc(100% - 60px);max-height:58%}
    .pp-note{display:none}   /* 手机上省空间；标题里已注明“估算” */
  }
</style>
</head>
<body>
<header>
  <div class="headtop">
    <h1>📻 HF 短波广播频率查询 <span class="tag">B26 · 2026 冬季</span></h1>
    <div class="headbtns">
      <a class="rptlink" href="country_exposure.html" target="_blank">🌍 国家暴露量</a>
      <a class="rptlink" href="exposure.html" target="_blank">🗣 语言暴露量</a>
      <button id="collapsebtn" title="隐藏/显示上方面板（全屏看地图）">▾</button>
    </div>
  </div>
  <div class="controls">
    <input id="q" placeholder="搜索：频率 / 呼号 / 台站 / 语言 / 国家…">
    <div class="ctrl-grp">
      <label>UTC 时间</label>
      <input type="number" id="th" min="0" max="23" placeholder="HH">
      <span style="color:var(--muted)">:</span>
      <input type="number" id="tm" min="0" max="59" placeholder="MM">
      <label class="nowchk" title="勾选后使用当前 UTC 时间并锁定"><input type="checkbox" id="nowchk" checked> 现在</label>
    </div>
    <button id="livebtn" class="primary">▶ 只看当前可收听</button>
    <div class="langtoggles" id="langtoggles">
      <button data-lang="zh" title="只看中文">中文</button>
      <button data-lang="en" title="只看英文">English</button>
    </div>
    <select id="langsel"><option value="">全部语言</option></select>
  </div>
</header>

<main>
  <div class="tabs">
    <button id="tabList" class="active">📋 频率列表</button>
    <button id="tabMap">🗺️ 世界地图</button>
  </div>

  <div class="chips" id="chips"></div>
  <div id="content"></div>

  <div id="mapview" style="display:none">
    <div class="mapwrap">
      <canvas id="map"></canvas>
      <div class="mapctrl">
        <button id="probebtn" title="把收音机拖到地图上，查看该地点可接收的广播（点一下放到地图中央）">📻</button>
        <button id="zin" title="放大">＋</button>
        <button id="zout" title="缩小">－</button>
        <button id="zreset" title="重置视图" style="font-size:13px">⤢</button>
        <button id="freqlbl" title="显示/隐藏频率标签" style="font-size:12px;font-weight:700">Hz</button>
        <button id="sunbtn" title="显示/隐藏太阳直射点" style="font-size:14px">☀</button>
      </div>
      <div class="maptip" id="maptip"></div>
      <div class="probepanel" id="probepanel" hidden></div>
    </div>
  </div>
</main>

<footer>
  <div class="stats" id="stats"></div>
  <div class="footlinks">
    <span>数据：<a href="https://www.hfcc.org/" target="_blank" rel="noopener">HFCC</a> B26 排程</span>
    <a href="https://github.com/yangkang5303/hfFreq" target="_blank" rel="noopener">GitHub</a>
  </div>
</footer>

<script>
const DATA = (() => {
  const P = JSON.parse(document.getElementById('hfdata').textContent);
  const C = P.cols;
  return P.rows.map(a => {
    const r = {};
    for (let i = 0; i < C.length; i++) r[C[i]] = a[i];
    const st = P.loc[r.loc];
    r.site = st[0]; r.lat = st[1]; r.lon = st[2];
    r.langname = P.lang[r.lang]; r.admname = P.adm[r.adm]; r.brcname = P.brc[r.brc];
    // 搜索用文本只算一次，避免每次输入都为全部记录重新拼接
    r._q = (r.f+' '+r.s+' '+r.e+' '+r.loc+' '+r.site+' '+r.langname+' '+r.lang+' '+
      r.brcname+' '+r.brc+' '+r.admname+' '+r.adm+' '+r.notes+' '+r.ciraf+' '+r.pow).toLowerCase();
    return r;
  });
})();
const LAND = JSON.parse(document.getElementById('hfland').textContent);

const $ = s => document.querySelector(s);
const qEl = $('#q'), thEl = $('#th'), tmEl = $('#tm'), langSel = $('#langsel'),
      liveBtn = $('#livebtn'), nowChk = $('#nowchk'),
      content = $('#content'), statsEl = $('#stats'), chipsEl = $('#chips');

let liveOnly = false;

// 中/英文快捷筛选（两个可同时选）
const langToggles = { zh: false, en: false };
function isZhLang(name){
  const n = (name||'').toLowerCase();
  return n.includes('chinese') || n.includes('cantonese') || n.includes('mandarin')
      || n.includes('hakka') || n.includes('min nan');
}
function isEnLang(name){
  return (name||'').toLowerCase().includes('english');
}
function langQuickMatch(r){
  if (!langToggles.zh && !langToggles.en) return true;
  const n = r.langname || r.lang || '';
  return (langToggles.zh && isZhLang(n)) || (langToggles.en && isEnLang(n));
}

// ---- helpers ----
const DOW = ['','周一','周二','周三','周四','周五','周六','周日'];

function nowUTC(){
  const d = new Date();
  return {h: d.getUTCHours(), m: d.getUTCMinutes(), dow: d.getUTCDay()===0?7:d.getUTCDay()};
}
function mins(t){ // "1230" -> 750 ; "2400" -> 1440
  const n = parseInt(t,10);
  if (isNaN(n)) return null;
  return Math.floor(n/100)*60 + (n%100);
}
function toHM(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

function isOnAir(rec, curMin, dow){
  const s = mins(rec.s), e = mins(rec.e);
  if (s===null||e===null) return false;
  if (rec.days && rec.days.length===7 && !rec.days.includes(String(dow))){
    // still allow; some use full week
  }
  let on;
  if (e <= s) on = curMin >= s || curMin < e;      // crosses midnight
  else on = curMin >= s && curMin < e;
  // weekday filter
  if (on && rec.days && /^[1-7]+$/.test(rec.days) && rec.days.length < 7){
    if (!rec.days.includes(String(dow))) on = false;
  }
  return on;
}

function bandOf(f){
  if (f < 2000) return '160m / 中波';
  if (f < 4000) return '120m / 90m / 75m';
  if (f < 6000) return '60m / 49m';
  if (f < 8000) return '41m';
  if (f < 10000) return '31m';
  if (f < 12000) return '25m';
  if (f < 14000) return '22m / 19m';
  if (f < 18000) return '16m / 13m';
  if (f < 22000) return '11m';
  return '10m 及更高';
}

function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

// ---- build UI ----
// 只列出数据库中真实存在（能解析出语言名）的语言，跳过未解析的多语言代码。
// 顺序按“语言暴露量”页（exposure.html）的排名；该页把中文、阿拉伯语各变体合并成一项，
// 这里把对应语言放在合并项的位置、组内按记录数排列。不在该页上的语言按字母排在最后。
// 注意：exposure.html 更新排名后，这份列表需要同步更新。
const EXPOSURE_ORDER = [
  "Chinese (merged)", "English", "Arabic (merged)", "Russian", "Multiple languages", "Spanish",
  "Japanese", "Korean", "Persian", "French", "Tibetan", "Dari", "Undetermined", "Turkish", "Hausa",
  "Mongolian", "Urdu", "Pushto", "Uighur", "Portuguese", "Vietnamese", "German", "Kazakh", "Dutch",
  "Romanian", "Somali", "Indonesian", "Nepali", "Tajik", "Filipino", "Swahili (macrolanguage)",
  "Bengali", "Central Pashto", "Esperanto", "Hindi", "Italian", "Albanian", "Bambara", "Amharic",
  "Hungarian", "Croatian", "Burmese", "Serbian", "Czech", "Tigrinya", "Bulgarian", "Kurdish",
  "Malay (individual language)", "Swahili (individual language)", "Central Khmer", "Tamil",
  "Middle Armenian", "Polish", "Sinhala", "Oromo", "Kanuri", "Kinyarwanda", "Fulah", "Mandingo",
  "Bislama", "Thai", "Hebrew", "Lao", "Ukrainian", "Kirghiz", "Turkmen", "Afar", "Armenian",
  "Azerbaijani", "Baluchi", "Malagasy", "Latin", "Huarijio", "Malayalam", "Macedo Romanian",
  "Arbëreshë Albanian", "Georgian", "Igbo", "Nigerian Pidgin", "Silt'e", "Tatar", "Tigre", "Uzbek",
  "Yoruba", "Javanese", "Shan", "Hmong Daw", "Kannada", "Manumanaw Karen", "Mon", "Rakhine",
  "Dzongkha", "S'gaw Karen", "Huli", "Asho Chin", "Iu Mien", "Kachin", "Kamayurá", "Khams Tibetan",
  "Kok Borok", "Lahu", "Lisu", "Lü", "Minangkabau", "Ngaju", "Peripheral Mongolian", "Telugu", "Yao",
  "Orokolo", "Belarusian", "Sidamo", "Sindhi", "Sundanese", "Rohingya", "Tai Dam", "Norwegian",
  "Khamti", "Rumai Palaung", "Assamese", "Hmong Njua", "Makhuwa", "Wannu", "Tsonga", "Turkana"
];
const MERGED_LANGS = {
  'Chinese (merged)': isZhLang,
  'Arabic (merged)': n => n.toLowerCase().includes('arabic'),
};
const langCount = new Map();
for (const r of DATA) if (r.langname) langCount.set(r.langname, (langCount.get(r.langname)||0) + 1);
const langs = [];
for (const name of EXPOSURE_ORDER){
  const match = MERGED_LANGS[name];
  const members = match
    ? [...langCount.keys()].filter(l => !langs.includes(l) && match(l)).sort((a,b)=>langCount.get(b)-langCount.get(a))
    : (langCount.has(name) && !langs.includes(name) ? [name] : []);
  langs.push(...members);
}
langs.push(...[...langCount.keys()].filter(l => !langs.includes(l)).sort((a,b)=>a.localeCompare(b)));
for (const l of langs){
  const o=document.createElement('option'); o.value=l; o.textContent=l; langSel.appendChild(o);
}

// ---- render ----
function currentFilters(){
  const q = qEl.value.trim().toLowerCase();
  const curMin = (parseInt(thEl.value,10)||0)*60 + (parseInt(tmEl.value,10)||0);
  const n = nowUTC();
  const dow = n.dow;
  const lang = langSel.value;
  let rows = DATA.filter(r=>{
    if (liveOnly && !isOnAir(r, curMin, dow)) return false;
    if (!langQuickMatch(r)) return false;
    if (lang && (r.langname||r.lang) !== lang) return false;
    if (q){
      if (!r._q.includes(q)) return false;
    }
    return true;
  });
  rows.sort((a,b)=>a.f-b.f || a.s.localeCompare(b.s));
  return {rows, curMin, dow};
}

let mapActive = false;

function render(){
  const {rows, curMin, dow} = currentFilters();

  // stats
  const total = DATA.length;
  const freqs = new Set(DATA.map(r=>r.f));
  const onRows = DATA.filter(r=>isOnAir(r, curMin, dow));
  const onair = onRows.length;
  const onfreqs = new Set(onRows.map(r=>r.f)).size;
  statsEl.innerHTML =
    `<span>过滤结果 <b>${rows.length}</b> 条</span>` +
    `<span>当前时刻 (${toHM(curMin)} UTC) 可收听 <b>${onair}</b> 条 / <b>${onfreqs}</b> 个频率</span>` +
    `<span>数据库共 <b>${total}</b> 条 · <b>${freqs.size}</b> 个频率</span>`;

  // band chips
  const bands = {};
  rows.forEach(r=>{ bands[bandOf(r.f)] = (bands[bandOf(r.f)]||0)+1; });
  chipsEl.innerHTML = Object.entries(bands).sort().map(([b,c])=>`<span class="chip">${b} <b>${c}</b></span>`).join('');

  if (!rows.length){
    content.innerHTML = `<div class="empty"><div class="big">📡</div>没有匹配的频率。<br>试试清除筛选，或换个关键词/时间。</div>`;
    if (mapActive){ MAP.build(rows); MAP.draw(); }
    return;
  }

  // 地图视图下列表是隐藏的，不必生成整张表格（切回列表时 showTab 会重新 render）
  if (mapActive){ MAP.build(rows); MAP.draw(); return; }

  // group by band
  const groups = {};
  rows.forEach(r=>{ const b=bandOf(r.f); (groups[b]=groups[b]||[]).push(r); });

  let html='';
  for (const [band, list] of Object.entries(groups)){
    html += `<div class="bandgroup" data-open="1"><h2 class="ghead" title="点击折叠/展开"><span class="chev">▾</span>${band} <span class="cnt">${list.length} 条</span></h2>`;
    html += `<table><thead><tr>
      <th>频率</th><th>时间</th><th>语言</th><th>电台 / 机构</th>
      <th class="col-days">日</th><th class="col-pow">功率</th><th class="col-az">方位</th>
      <th class="col-ciraf">CIRAF</th><th class="col-date">日期</th><th>发射地 / 国家</th><th class="col-days">备注</th>
      </tr></thead><tbody>`;
    for (const r of list){
      const on = liveOnly && isOnAir(r, curMin, dow);
      const modBadge = r.mod && r.mod.toUpperCase()!=='D'
        ? `<span class="badge b-drm">${r.mod}</span>` : '';
      const onBadge = on && liveOnly ? `<span class="badge b-now">播出中</span>` : '';
      html += `<tr>
        <td class="freq">${r.f}${onBadge}</td>
        <td class="time">${r.s}–${r.e}</td>
        <td class="lang">${r.langname||r.lang||''}<small> ${r.langname?('('+r.lang+')'):''}</small></td>
        <td class="brc">${r.brcname||r.brc||'—'}<small>${r.brc||''}${r.fmo?(' · FMO '+r.fmo):''}</small></td>
        <td class="col-days">${r.days||''}</td>
        <td class="col-pow">${r.pow?r.pow+' kW':''}</td>
        <td class="col-az">${r.az||''}${r.az&&r.az!=='0'?'°':''}</td>
        <td class="col-ciraf">${r.ciraf||''}</td>
        <td class="col-date">${fmtDate(r.fd)}–${fmtDate(r.td)} ${modBadge}</td>
        <td class="site">${r.site||r.loc||''}<small>${r.admname||r.adm||''}</small></td>
        <td class="col-days notes">${r.notes||''}${r.alt?(' ALT:'+r.alt):''}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
  }
  content.innerHTML = html;
}

function fmtDate(d){
  if (!d || d.length!==6) return d||'';
  return d.slice(0,2)+'/'+d.slice(2,4);
}

// ---- events ----
qEl.addEventListener('input', debounce(render,150));
thEl.addEventListener('input', render);
tmEl.addEventListener('input', render);

// 中/英文快捷按钮（可同时选中）
const langToggleBtns = [...document.querySelectorAll('#langtoggles button')];
function syncLangButtons(){
  langToggleBtns.forEach(b => b.classList.toggle('on', !!langToggles[b.dataset.lang]));
}
langToggleBtns.forEach(b => b.addEventListener('click', () => {
  langToggles[b.dataset.lang] = !langToggles[b.dataset.lang];
  if (langToggles.zh || langToggles.en) langSel.value = '';   // 快捷优先，清空下拉
  syncLangButtons();
  render();
}));

// 语言下拉（选择后清除快捷按钮）
langSel.addEventListener('change', () => {
  if (langSel.value){ langToggles.zh = false; langToggles.en = false; syncLangButtons(); }
  render();
});

// ---- view tabs ----
const tabList = document.getElementById('tabList');
const tabMap  = document.getElementById('tabMap');
const contentEl = document.getElementById('content');
const mapview = document.getElementById('mapview');

function showTab(map){
  mapActive = map;
  tabList.classList.toggle('active', !map);
  tabMap.classList.toggle('active', map);
  contentEl.style.display = map ? 'none' : '';
  chipsEl.style.display = map ? 'none' : '';
  mapview.style.display = map ? '' : 'none';
  if (map) MAP.resize();
  render();
}
tabList.addEventListener('click', () => showTab(false));
tabMap.addEventListener('click', () => showTab(true));
window.addEventListener('resize', debounce(() => { if (mapActive) MAP.resize(); }, 150));

// ---- 折叠/展开频段组 ----
contentEl.addEventListener('click', e => {
  const h = e.target.closest('.bandgroup .ghead');
  if (!h) return;
  const g = h.parentElement;
  const collapsed = g.classList.toggle('collapsed');
  const chev = h.querySelector('.chev');
  if (chev) chev.textContent = collapsed ? '▸' : '▾';
});

liveBtn.addEventListener('click', ()=>{
  liveOnly = !liveOnly;
  liveBtn.classList.toggle('on', liveOnly);
  liveBtn.textContent = liveOnly ? '✓ 只看当前可收听' : '▶ 只看当前可收听';
  render();
});

// “现在”复选框：勾选后锁定为当前 UTC 时间，时间输入框不可编辑
function applyNowLock(){
  const on = nowChk.checked;
  thEl.disabled = on;
  tmEl.disabled = on;
  if (on){ const n = nowUTC(); thEl.value = n.h; tmEl.value = n.m; }
}
nowChk.addEventListener('change', () => { applyNowLock(); render(); });
setInterval(() => {
  if (nowChk.checked && !document.hidden){ const n = nowUTC(); thEl.value = n.h; tmEl.value = n.m; render(); }
}, 30000);

// 隐藏/显示地图上方的所有面板（手机上看地图时用）
const collapseBtn = document.getElementById('collapsebtn');
collapseBtn.addEventListener('click', () => {
  const hidden = document.body.classList.toggle('top-hidden');
  collapseBtn.textContent = hidden ? '▴' : '▾';
  if (typeof MAP !== 'undefined') setTimeout(() => MAP.resize(), 60);
});

/* ============================================================
   世界地图：等距圆柱投影 + 每个发射台按方位角/功率绘制的箭头
   ============================================================ */
const MAP = (() => {
  const cv = document.getElementById('map');
  const ctx = cv.getContext('2d');
  const tip = document.getElementById('maptip');
  const legend = document.getElementById('maplegend');   // 图例已移除，保留变量以兼容旧代码

  // 功率 → 视觉权重 powT(p) ∈ [0,1]
  //   · 100~800 kW：按实际功率线性比例
  //   · 100 kW 以下：按 100 的一半（=50）显示，即统一落在起点
  const PMAX = 800, PBASE = 100, PBASE_HALF = 50;
  const LEN_MIN = 3.2, LEN_MAX = 17;
  function powT(p){
    if (!(p > 0)) p = PBASE_HALF;
    const eff = p < PBASE ? PBASE_HALF : Math.min(p, PMAX);
    return (eff - PBASE_HALF) / (PMAX - PBASE_HALF);   // 0..1
  }
  function powerLen(p){
    return LEN_MIN + (LEN_MAX - LEN_MIN) * powT(p);
  }

  // 功率 → 颜色：红→橙→黄→绿→青→蓝→紫（与箭头长度同一权重）
  function powerColor(p){
    const hue = powT(p) * 280;   // HSL: 0°红 → 60°黄 → 120°绿 → 180°青 → 240°蓝 → 280°紫
    return `hsl(${hue.toFixed(0)}, 80%, 60%)`;
  }
  function bandName(f){
    if (f < 3000)  return '< 3000 kHz';
    if (f < 6000)  return '3000–5999 kHz';
    if (f < 8000)  return '6000–7999 kHz';
    if (f < 10000) return '8000–9999 kHz';
    if (f < 12000) return '10000–11999 kHz';
    if (f < 14000) return '12000–13999 kHz';
    if (f < 18000) return '14000–17999 kHz';
    if (f < 22000) return '18000–21999 kHz';
    return '≥ 22000 kHz';
  }

  // 视图状态（经纬度窗口）
  const view = { lon0: -180, lon1: 180, lat0: -60, lat1: 75 };
  const HOME = { ...view };

  let siteGroups = [];     // 当前渲染的站点聚合
  let hoverSite = null;
  let dpr = 1;
  let showFreq = true;     // 是否在箭头旁显示频率标签
  let showSun = true;      // 是否显示太阳直射点
  let labelQueue = [];     // 频率标签先收集，最后统一画在最上层

  function proj(lon, lat){
    const W = cv.width / dpr, H = cv.height / dpr;
    const x = (lon - view.lon0) / (view.lon1 - view.lon0) * W;
    const y = (view.lat1 - lat) / (view.lat1 - view.lat0) * H;
    return [x, y];
  }
  function degPerPx(){
    const W = cv.width / dpr;
    return (view.lon1 - view.lon0) / W;
  }

  // 让可见经纬范围与画布长宽比一致，避免把地图拉长/压扁
  // （proj 会把 view 的经纬范围铺满整个画布，只有比例一致时才不会变形）
  function fitViewAspect(W, H){
    if (!(W > 0 && H > 0)) return;
    const target = W / H;                       // lonSpan / latSpan 应等于画布长宽比
    const cx = (view.lon0 + view.lon1) / 2;
    const cy = (view.lat0 + view.lat1) / 2;
    let latSpan = view.lat1 - view.lat0;
    let lonSpan = view.lon1 - view.lon0;
    if (lonSpan / latSpan > target) latSpan = lonSpan / target;  // 地图太宽 → 加高纬度
    else                            lonSpan = latSpan * target;  // 地图太高 → 加宽经度
    if (latSpan > 170){ latSpan = 170; lonSpan = latSpan * target; }   // 纬度不能超过 ±85
    if (lonSpan > 360){ lonSpan = 360; latSpan = lonSpan / target; }
    latSpan = Math.max(2, Math.min(170, latSpan));
    lonSpan = Math.max(3, Math.min(360, lonSpan));
    view.lat0 = Math.max(-85, Math.min(85 - latSpan, cy - latSpan / 2));
    view.lat1 = view.lat0 + latSpan;
    view.lon0 = cx - lonSpan / 2;
    view.lon1 = view.lon0 + lonSpan;
  }

  function resize(){
    const wrap = cv.parentElement;
    const cssW = wrap.clientWidth;
    // 窄屏（竖屏手机）或触摸设备都按“移动端”处理
    const mobile = window.matchMedia('(max-width:820px)').matches
                || window.matchMedia('(pointer: coarse)').matches;
    let cssH;
    if (mobile){
      // 手机上尽量占满剩余视口，确保地图占据大部分区域
      const hdr = document.querySelector('header');
      // 留出页脚的高度，让统计行在地图下方也能直接看到
      const ftr = document.querySelector('footer');
      const used = (hdr ? hdr.offsetHeight : 0) + (ftr ? ftr.offsetHeight : 0) + 28;
      cssH = Math.max(280, Math.min(window.innerHeight - used, window.innerHeight * 0.78));
    } else {
      cssH = Math.max(320, Math.round(cssW * 0.42));
    }
    cv.style.height = cssH + 'px';
    dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 手机屏是竖屏，与宽幅世界地图比例差很多；按画布比例重算视图，
    // 这样隐藏上方元素、地图变高时只是看到更多范围，而不是被拉长。
    if (mobile) fitViewAspect(cssW, cssH);
    draw();
  }

  // 一级简化：把 land 要素坐标全部展平为环
  const RINGS = (() => {
    const out = [];
    const push = coords => out.push(coords);
    for (const f of LAND.features){
      const g = f.geometry; if (!g) continue;
      if (g.type === 'Polygon') g.coordinates.forEach(push);
      else if (g.type === 'MultiPolygon') g.coordinates.forEach(poly => poly.forEach(push));
    }
    return out;
  })();

  function drawGraticule(W, H){
    ctx.save();
    ctx.strokeStyle = 'rgba(88,166,255,.12)';
    ctx.fillStyle = 'rgba(139,152,165,.75)';
    ctx.lineWidth = 1;
    ctx.font = '10px -apple-system,sans-serif';
    // 经线
    const lonStep = (view.lon1 - view.lon0) > 200 ? 30 : (view.lon1 - view.lon0) > 90 ? 10 : 5;
    for (let lon = -180; lon <= 180; lon += lonStep){
      if (lon < view.lon0 || lon > view.lon1) continue;
      const [x] = proj(lon, 0);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      if (W > 500) ctx.fillText(lon+'°', x+3, H-4);
    }
    // 纬线
    const latStep = (view.lat1 - view.lat0) > 90 ? 30 : (view.lat1 - view.lat0) > 40 ? 10 : 5;
    for (let lat = -90; lat <= 90; lat += latStep){
      if (lat < view.lat0 || lat > view.lat1) continue;
      const [, y] = proj(0, lat);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      const label = lat === 0 ? '0°' : (lat>0 ? lat+'°N' : Math.abs(lat)+'°S');
      if (H > 260) ctx.fillText(label, 4, y-3);
    }
    ctx.restore();
  }

  function drawLand(W, H){
    ctx.save();
    ctx.lineWidth = 1.1;
    for (const ring of RINGS){
      ctx.beginPath();
      let started = false;
      for (const [lon, lat] of ring){
        const [x, y] = proj(lon, lat);
        if (!started){ ctx.moveTo(x, y); started = true; }
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = '#2b3b4d';
      ctx.fill();
      ctx.strokeStyle = 'rgba(185,210,235,.92)';
      ctx.stroke();
    }
    ctx.restore();
  }

  // 根据当前选定的 UTC 时间计算太阳直射点（赤纬 + 直射经度）
  function subSolar(){
    const h = parseInt(document.getElementById('th').value,10) || 0;
    const m = parseInt(document.getElementById('tm').value,10) || 0;
    const utcHours = h + m/60;
    const rad = x => x*Math.PI/180;
    // 年内第几天（用当天的真实日期，季节才准确）
    const now = new Date();
    const doy = Math.floor((Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate())
              - Date.UTC(now.getUTCFullYear(),0,1)) / 86400000) + 1;
    // 太阳赤纬
    const decl = -23.44 * Math.cos(rad(360/365 * (doy + 10)));
    // 时差方程（分钟）
    const B = rad(360/365 * (doy - 81));
    const eot = 9.87*Math.sin(2*B) - 7.53*Math.cos(B) - 1.5*Math.sin(B);
    // 直射点经度：UTC 12:00 时约在 0°经线，时差修正
    let lonS = 15 * (12 - (utcHours + eot/60));
    lonS = ((lonS + 180) % 360 + 360) % 360 - 180;
    return { decl, lonS };
  }

  // 绘制太阳直射点标记（☀）
  function drawSun(){
    if (!showSun) return;
    const { decl, lonS } = subSolar();
    const [x, y] = proj(lonS, decl);
    const W = cv.width / dpr, H = cv.height / dpr;
    if (x < -24 || x > W+24 || y < -24 || y > H+24) return;
    ctx.save();
    // 光晕
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#ffd54a';
    ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI*2); ctx.fill();
    // 光芒
    ctx.globalAlpha = 0.95;
    ctx.strokeStyle = '#ffd54a';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (let i=0;i<8;i++){
      const a = i * Math.PI/4;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a)*7.5, y + Math.sin(a)*7.5);
      ctx.lineTo(x + Math.cos(a)*12.5, y + Math.sin(a)*12.5);
      ctx.stroke();
    }
    // 日面
    ctx.beginPath(); ctx.arc(x, y, 5.2, 0, Math.PI*2);
    ctx.fillStyle = '#ffe57a'; ctx.fill();
    ctx.strokeStyle = '#c9962a'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }

  // 画一支箭头：从 (x0,y0) 出发，方位角 az 度（0=北，顺时针），屏幕长度 px
  function drawArrow(x0, y0, az, lenPx, color, width, alpha){
    // 方位角 → 屏幕方向。等距圆柱投影下，东向水平、北向垂直。
    const rad = az * Math.PI / 180;
    const dx = Math.sin(rad) * lenPx;
    const dy = -Math.cos(rad) * lenPx;
    const x1 = x0 + dx, y1 = y0 + dy;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();

    // 箭头尖
    const head = Math.max(4, Math.min(11, lenPx * 0.28));
    const ang = Math.atan2(dy, dx);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - head * Math.cos(ang - 0.42), y1 - head * Math.sin(ang - 0.42));
    ctx.lineTo(x1 - head * Math.cos(ang + 0.42), y1 - head * Math.sin(ang + 0.42));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    return [x1, y1];
  }

  function drawSite(s, W, H){
    const [x, y] = proj(s.lon, s.lat);
    if (x < -40 || x > W+40 || y < -40 || y > H+40) return;

    const dpp = degPerPx();               // 屏幕上 1px 对应多少度经度
    const latScale = Math.max(0.15, 1 / Math.max(0.25, Math.cos(s.lat*Math.PI/180)));

    // 先画箭头（非全向）
    for (const g of s.groups){
      const lenDeg = powerLen(g.maxPow);
      const lenPx = Math.max(6, (lenDeg / dpp) / latScale);
      const t = powT(g.maxPow);
      const width = 1.2 + t * 2.6;
      const alpha = 0.45 + 0.5 * t;
      let tipX = x, tipY = y;
      if (g.az === 0){
        // 全向：画圆环
        ctx.save();
        ctx.globalAlpha = alpha * 0.9;
        ctx.strokeStyle = g.color;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.arc(x, y, lenPx * 0.6, 0, Math.PI*2);
        ctx.stroke();
        ctx.restore();
        tipX = x; tipY = y - lenPx * 0.6 - 4;
      } else {
        const tip = drawArrow(x, y, g.az, lenPx, g.color, width, alpha);
        if (tip){ tipX = tip[0]; tipY = tip[1]; }
      }

      // 频率标签（kHz）——先收集坐标，最后统一画在最上层，避免被其他箭头遮住
      if (showFreq && g.freqs && g.freqs.length){
        const label = g.freqs.length <= 3
          ? g.freqs.join('/')
          : g.freqs.slice(0,3).join('/') + '…';
        let lx = tipX, ly = tipY;
        if (g.az !== 0){
          const rad = g.az * Math.PI/180;
          lx = tipX + Math.sin(rad) * 9;
          ly = tipY - Math.cos(rad) * 9;
        }
        labelQueue.push({ text: label, x: lx, y: ly });
      }
    }

    // 站点圆点
    const hot = hoverSite === s;
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, hot ? 5 : 3, 0, Math.PI*2);
    ctx.fillStyle = hot ? '#ffffff' : '#0f1419';
    ctx.fill();
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = hot ? '#3fb950' : 'rgba(230,237,243,.9)';
    ctx.stroke();
    ctx.restore();

    // 放大时显示台站名
    if (dpp < 0.35){
      ctx.save();
      ctx.globalAlpha = hot ? 1 : 0.7;
      ctx.fillStyle = hot ? '#3fb950' : 'rgba(200,210,222,.85)';
      ctx.font = (hot?'bold ':'') + '10.5px -apple-system,sans-serif';
      ctx.fillText(s.name, x + 6, y - 5);
      ctx.restore();
    }

    s._px = x; s._py = y;
  }

  function drawLabels(){
    if (!labelQueue.length) return;
    ctx.save();
    ctx.font = '600 9.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const l of labelQueue){
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(8,13,18,.95)';
      ctx.strokeText(l.text, l.x, l.y);
      ctx.fillStyle = '#e6edf3';
      ctx.fillText(l.text, l.x, l.y);
    }
    ctx.restore();
  }

  // 每帧最多重绘一次：拖动/悬停/缩放时的多次 draw() 请求合并到下一帧
  let drawPending = false;
  function draw(){
    if (drawPending) return;
    drawPending = true;
    requestAnimationFrame(() => { drawPending = false; drawNow(); });
  }
  function drawNow(){
    const W = cv.width / dpr, H = cv.height / dpr;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#10171e';
    ctx.fillRect(0, 0, W, H);
    drawGraticule(W, H);
    drawLand(W, H);
    // 暗色下让站点箭头更亮：先按功率从小到大画，大的覆盖在上面
    labelQueue = [];
    const sorted = [...siteGroups].sort((a,b)=>a.maxPow-b.maxPow);
    for (const s of sorted) drawSite(s, W, H);
    drawSun();      // 太阳直射点标记（在箭头之上）
    drawLabels();   // 频率标签最后绘制，始终位于最顶层
    drawProbe();    // 接收点图钉在最上层
  }

  // 根据当前过滤后的行重建站点聚合
  function build(rows){
    const bySite = new Map();
    for (const r of rows){
      if (r.lat == null || r.lon == null) continue;
      const key = r.loc;
      if (!bySite.has(key)){
        bySite.set(key, {
          loc: r.loc, name: r.site || r.loc, lat: r.lat, lon: r.lon,
          adm: r.admname || r.adm, entries: [], maxPow: 0,
        });
      }
      const s = bySite.get(key);
      s.entries.push(r);
      const p = parseInt(r.pow,10) || 0;
      if (p > s.maxPow) s.maxPow = p;
    }

    // 每个站点：按（方位角取整到 10°、频段）聚合
    const groupsOut = [];
    for (const s of bySite.values()){
      const gmap = new Map();
      for (const r of s.entries){
        const azRaw = parseInt(r.az,10);
        const az = isNaN(azRaw) ? 0 : azRaw;
        const azKey = az === 0 ? 0 : Math.round(az/10)*10 % 360;
        const bk = bandName(r.f);
        const key = azKey + '|' + bk;
        const p = parseInt(r.pow,10) || 0;
        if (!gmap.has(key)) gmap.set(key, {az: azKey, band: bk, color: powerColor(p), maxPow: p, n: 0, freqs: []});
        const g = gmap.get(key);
        g.n++; if (p > g.maxPow) g.maxPow = p;
        if (!g.freqs.includes(r.f)) g.freqs.push(r.f);
      }
      s.groups = [...gmap.values()];
      s.groups.forEach(g => g.freqs.sort((a,b)=>a-b));
      s.maxPowAll = Math.max(s.maxPow, 1);
      groupsOut.push(s);
    }
    siteGroups = groupsOut;
    lastRows = rows;
    if (probe && !probeDrag) updateProbe();   // 时间/筛选变化时刷新接收点列表
  }

  function pickSite(mx, my){
    let best = null, bestD = 16;
    for (const s of siteGroups){
      if (s._px == null) continue;
      const d = Math.hypot(mx - s._px, my - s._py);
      if (d < bestD){ bestD = d; best = s; }
    }
    return best;
  }

  const BAND_ORDER = f => f;

  function showTip(s, mx, my){
    const entries = [...s.entries].sort((a,b)=>b.f-a.f);
    const shown = entries.slice(0, 8);
    let rows = '<tr><th>频率</th><th>时间(UTC)</th><th>语言</th><th>电台 / 机构</th><th>功率</th><th>方位</th></tr>';
    for (const r of shown){
      rows += `<tr><td class="t-freq">${r.f}</td><td>${r.s}–${r.e}</td>`+
              `<td>${r.langname||r.lang||''}</td><td>${r.brcname||r.brc||''}</td>`+
              `<td>${r.pow?r.pow+'kW':''}</td><td>${r.az&&r.az!=='0'?r.az+'°':'全向'}</td></tr>`;
    }
    if (entries.length > shown.length)
      rows += `<tr><td colspan="6" class="more">… 还有 ${entries.length-shown.length} 条（在列表中查看）</td></tr>`;

    tip.innerHTML = `<div class="t-site">📡 ${s.name}</div>`+
      `<div class="t-meta">${s.loc} · ${s.adm||''} · ${s.lat.toFixed(1)}°, ${s.lon.toFixed(1)}° · ${entries.length} 条</div>`+
      `<table>${rows}</table>`;
    tip.classList.add('show');
    positionTip(mx, my);
  }

  function positionTip(mx, my){
    const wrap = cv.parentElement;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = mx + 16;
    if (x + w > wrap.clientWidth - 8) x = mx - w - 16;         // 右侧放不下就翻到左边
    x = Math.max(8, Math.min(x, wrap.clientWidth - w - 8));    // 再限幅，避免溢出被裁切
    let y = my + 12;
    if (y + h > wrap.clientHeight - 8) y = Math.max(8, my - h - 12);
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }
  function hideTip(){ tip.classList.remove('show'); hoverSite = null; draw(); }

  // ---- 交互：悬停 / 拖动 / 缩放 ----
  let drag = null;
  // 接收点状态（逻辑见文件后部“接收点”一节）
  const probeBtn = document.getElementById('probebtn');
  const probePanel = document.getElementById('probepanel');
  let probe = null;          // {lat, lon}
  let probeResults = [];
  let probeDrag = null;      // 拖动图钉时的抓取偏移
  let lastRows = [];         // 最近一次 build 的过滤结果
  function evtPos(e){
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return [t.clientX - r.left, t.clientY - r.top];
  }
  cv.addEventListener('mousemove', e => {
    const [mx, my] = evtPos(e);
    if (probeDrag){ moveProbeDrag(mx, my); return; }
    if (drag){
      const W = cv.width/dpr;
      const dLon = (mx - drag.x) * (view.lon1-view.lon0) / W;
      const H = cv.height/dpr;
      const dLat = (my - drag.y) * (view.lat1-view.lat0) / H;
      view.lon0 -= dLon; view.lon1 -= dLon;
      view.lat1 += dLat; view.lat0 += dLat;
      clampView();
      drag = {x: mx, y: my};
      hideTip();
      return;
    }
    const s = pickSite(mx, my);
    if (s){ hoverSite = s; showTip(s, mx, my); draw(); }
    else if (hoverSite){ hideTip(); }
  });
  cv.addEventListener('mouseleave', hideTip);
  cv.addEventListener('mousedown', e => {
    const [mx,my]=evtPos(e);
    if (hitProbe(mx, my)){ startProbeDrag(mx, my); return; }
    drag={x:mx,y:my}; cv.classList.add('dragging');
  });
  window.addEventListener('mouseup', () => {
    if (probeDrag) endProbeDrag();
    drag = null; cv.classList.remove('dragging');
  });

  // 触摸：单指拖动，双指捏合缩放（两指中点移动时同时平移）
  let pinch = null;
  function pinchState(e){
    const r = cv.getBoundingClientRect();
    const a = e.touches[0], b = e.touches[1];
    return { x: (a.clientX + b.clientX)/2 - r.left, y: (a.clientY + b.clientY)/2 - r.top,
             d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) };
  }
  cv.addEventListener('touchstart', e => {
    if (e.touches.length === 1){
      const [mx,my]=evtPos(e);
      if (hitProbe(mx, my)){ startProbeDrag(mx, my); drag=null; pinch=null; return; }
      drag={x:mx,y:my}; pinch=null;
    }
    else if (e.touches.length === 2){ drag=null; pinch=pinchState(e); }
  }, {passive:true});
  cv.addEventListener('touchmove', e => {
    if (probeDrag && e.touches.length===1){
      e.preventDefault();
      const [mx,my]=evtPos(e); moveProbeDrag(mx, my);
    } else if (pinch && e.touches.length===2){
      e.preventDefault();
      const p = pinchState(e);
      if (p.d > 0 && pinch.d > 0){
        const W=cv.width/dpr, H=cv.height/dpr;
        const dLon=(p.x-pinch.x)*(view.lon1-view.lon0)/W;
        const dLat=(p.y-pinch.y)*(view.lat1-view.lat0)/H;
        view.lon0-=dLon; view.lon1-=dLon; view.lat1+=dLat; view.lat0+=dLat;
        zoom(pinch.d / p.d, p.x, p.y);   // 手指张开 → 放大
      }
      pinch = p;
    } else if (drag && e.touches.length===1){
      e.preventDefault();
      const [mx,my]=evtPos(e);
      const W=cv.width/dpr, H=cv.height/dpr;
      const dLon=(mx-drag.x)*(view.lon1-view.lon0)/W;
      const dLat=(my-drag.y)*(view.lat1-view.lat0)/H;
      view.lon0-=dLon; view.lon1-=dLon; view.lat1+=dLat; view.lat0+=dLat;
      clampView(); drag={x:mx,y:my}; hideTip();
    }
  }, {passive:false});
  function touchEnd(e){
    if (probeDrag){ endProbeDrag(); drag = null; pinch = null; return; }
    pinch = null;
    // 双指抬起一指后，用剩下的手指继续拖动，避免画面跳动
    if (e.touches.length === 1){ const [mx,my]=evtPos(e); drag={x:mx,y:my}; } else drag=null;
  }
  cv.addEventListener('touchend', touchEnd);
  cv.addEventListener('touchcancel', touchEnd);

  function clampView(){
    const lonSpan = Math.min(360, view.lon1 - view.lon0);
    const latSpan = Math.min(160, view.lat1 - view.lat0);
    // 限幅经度在 -180..180
    if (view.lon0 < -180){ view.lon1 += -180-view.lon0; view.lon0 = -180; }
    if (view.lon1 > 180){ view.lon0 -= view.lon1-180; view.lon1 = 180; }
    view.lon0 = Math.max(-180, Math.min(180-lonSpan, view.lon0));
    view.lon1 = view.lon0 + lonSpan;
    // 纬度 -85..85
    view.lat0 = Math.max(-85, Math.min(85-latSpan, view.lat0));
    view.lat1 = view.lat0 + latSpan;
  }

  function zoom(factor, cx, cy){
    const W = cv.width/dpr, H = cv.height/dpr;
    cx = cx == null ? W/2 : cx; cy = cy == null ? H/2 : cy;
    const lonAt = view.lon0 + (cx/W)*(view.lon1-view.lon0);
    const latAt = view.lat1 - (cy/H)*(view.lat1-view.lat0);
    let lonSpan = (view.lon1-view.lon0)*factor;
    let latSpan = (view.lat1-view.lat0)*factor;
    lonSpan = Math.max(3, Math.min(360, lonSpan));
    latSpan = Math.max(2, Math.min(170, latSpan));
    const rx = (cx/W), ry = (cy/H);
    view.lon0 = lonAt - rx*lonSpan; view.lon1 = view.lon0 + lonSpan;
    view.lat1 = latAt + ry*latSpan; view.lat0 = view.lat1 - latSpan;
    clampView(); hideTip();
  }

  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const [mx, my] = evtPos(e);
    zoom(e.deltaY > 0 ? 1.18 : 0.85, mx, my);
  }, {passive:false});

  document.getElementById('zin').onclick  = () => zoom(0.75);
  document.getElementById('zout').onclick = () => zoom(1.33);
  document.getElementById('zreset').onclick = () => { Object.assign(view, HOME); hideTip(); resize(); };
  const freqBtn = document.getElementById('freqlbl');
  freqBtn.classList.toggle('on', showFreq);
  freqBtn.onclick = () => { showFreq = !showFreq; freqBtn.classList.toggle('on', showFreq); draw(); };
  const sunBtn = document.getElementById('sunbtn');
  sunBtn.classList.toggle('on', showSun);
  sunBtn.onclick = () => { showSun = !showSun; sunBtn.classList.toggle('on', showSun); draw(); };

  function renderLegend(){
    let h = '<div style="color:var(--text);font-weight:600;margin-bottom:6px">图例</div>';
    h += '<div class="row"><svg width="34" height="12"><line x1="1" y1="6" x2="24" y2="6" stroke="#8b98a5" stroke-width="2"/><polygon points="24,1 34,6 24,11" fill="#8b98a5"/></svg> 箭头=发射方位角</div>';
    h += '<div class="row"><svg width="34" height="12"><line x1="1" y1="6" x2="14" y2="6" stroke="#8b98a5" stroke-width="1.4"/><line x1="1" y1="6" x2="30" y2="6" stroke="#e6edf3" stroke-width="3.4"/></svg> 长度/颜色=功率</div>';
    h += '<div class="row"><svg width="34" height="12"><circle cx="17" cy="6" r="5" fill="none" stroke="#8b98a5" stroke-width="1.5"/></svg> 圆环=全向(0°)</div>';
    h += '<div class="row"><span style="width:16px;height:14px;display:inline-flex;align-items:center;justify-content:center;color:#ffd54a;font-size:14px">☀</span> 太阳直射点（按 UTC 时间）</div>';
    h += '<div style="margin:7px 0 3px;color:var(--text)">颜色=发射功率</div>';
    h += '<div style="height:12px;border-radius:3px;margin:2px 0 4px;background:linear-gradient(90deg,hsl(0,80%,60%),hsl(60,80%,60%),hsl(120,80%,60%),hsl(180,80%,60%),hsl(240,80%,60%),hsl(280,80%,60%))\"></div>';
    h += '<div style="position:relative;height:14px;font-size:10.5px;color:var(--muted)">'
       + '<span style="position:absolute;left:0">≤100</span>'
       + '<span style="position:absolute;left:27%;transform:translateX(-50%)">250</span>'
       + '<span style="position:absolute;left:60%;transform:translateX(-50%)">500</span>'
       + '<span style="position:absolute;right:0">800 kW</span></div>';
    h += '<div class="hint">颜色/长度：100 kW 以下统一按 100 的一半显示；100–800 kW 按实际功率线性比例。<br>☀ 为当前 UTC 时间的太阳直射点，改变上方时间即可看到它移动；用 ☀ 按钮开关。<br>箭头旁数字为发射频率(kHz)，用 Hz 按钮开关。<br>滚轮/双指缩放，拖动平移，悬停查看台站全部频率。</div>';
    legend.innerHTML = h;
  }

  /* ============================================================
     接收点：把 📻 拖到地图上，估算该点能收到的广播并按强弱排序
     粗略模型（仅供参考）：自由空间场强 + 天线方向增益 − 每跳损耗
                         − 白天 D 层吸收（低频）− 超过 MUF 的损耗（夜间高频）
     ============================================================ */
  const RAD = Math.PI / 180;
  const LEVELS = [   // 估算场强（dBμV/m）下限 → 等级
    { min: 54, n: 5, name: '极强', color: '#3fb950' },
    { min: 44, n: 4, name: '强',   color: '#9be36b' },
    { min: 34, n: 3, name: '良好', color: '#d2c022' },
    { min: 24, n: 2, name: '一般', color: '#f0883e' },
    { min: 14, n: 1, name: '微弱', color: '#8b98a5' },
  ];
  const PROBE_MAX = 60;   // 列表最多显示条数

  // 大圆距离（km）、从发射台出发的方位角、路径中点
  function pathGeom(lat1, lon1, lat2, lon2){
    const p1 = lat1*RAD, p2 = lat2*RAD, dl = (lon2-lon1)*RAD;
    const a = Math.sin((p2-p1)/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    const dist = 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(a)));
    const brg = (Math.atan2(Math.sin(dl)*Math.cos(p2),
      Math.cos(p1)*Math.sin(p2) - Math.sin(p1)*Math.cos(p2)*Math.cos(dl)) / RAD + 360) % 360;
    const bx = Math.cos(p2)*Math.cos(dl), by = Math.cos(p2)*Math.sin(dl);
    const mlat = Math.atan2(Math.sin(p1)+Math.sin(p2), Math.sqrt((Math.cos(p1)+bx)**2 + by**2)) / RAD;
    const mlon = lon1 + Math.atan2(by, Math.cos(p1)+bx) / RAD;
    return { dist, brg, mlat, mlon };
  }

  function estimateField(r, lat, lon, sun){
    const p = parseFloat(r.pow);
    if (!(p > 0) || r.lat == null || r.lon == null) return null;
    const g = pathGeom(r.lat, r.lon, lat, lon);
    const d = Math.max(g.dist, 50);
    const az = parseInt(r.az, 10) || 0;
    let gain;
    if (az === 0) gain = 2;   // 全向
    else {
      const off = Math.abs(((g.brg - az) % 360 + 540) % 360 - 180);   // 偏离天线主瓣的角度 0..180
      gain = Math.max(-8, 15 - 12 * (off / 30) ** 2);
    }
    const fMHz = r.f / 1000;
    const hops = Math.max(1, Math.ceil(d / 3500));
    // 路径中点的太阳天顶角余弦：>0 为白天
    const cosz = Math.max(0, Math.sin(g.mlat*RAD)*Math.sin(sun.decl*RAD)
      + Math.cos(g.mlat*RAD)*Math.cos(sun.decl*RAD)*Math.cos((g.mlon - sun.lonS)*RAD));
    const absorb = Math.min(60, hops * 30 * cosz * (5 / fMHz) ** 2);
    const muf = 10 + 18 * cosz;   // 夜间约 10 MHz，正午约 28 MHz
    const mufLoss = fMHz > muf ? Math.min(40, 30 * (fMHz / muf - 1)) : 0;
    const E = 104.8 + 10*Math.log10(p) + gain - 20*Math.log10(d) - 10 - hops*6 - absorb - mufLoss;
    return { E, dist: g.dist };
  }

  function updateProbe(){
    if (!probe){ probePanel.hidden = true; return; }
    const curMin = (parseInt(thEl.value,10)||0)*60 + (parseInt(tmEl.value,10)||0);
    const dow = nowUTC().dow;
    const sun = subSolar();
    const res = [];
    for (const r of lastRows){
      if (!isOnAir(r, curMin, dow)) continue;
      const est = estimateField(r, probe.lat, probe.lon, sun);
      const lv = est && LEVELS.find(l => est.E >= l.min);
      if (lv) res.push({ r, E: est.E, dist: est.dist, lv });
    }
    probeResults = res.sort((a,b) => b.E - a.E);
    renderProbePanel(curMin);
    draw();
  }

  function fmtLatLon(lat, lon){
    return `${Math.abs(lat).toFixed(1)}°${lat>=0?'N':'S'}, ${Math.abs(lon).toFixed(1)}°${lon>=0?'E':'W'}`;
  }
  function renderProbePanel(curMin){
    const shown = probeResults.slice(0, PROBE_MAX);
    let h = `<div class="pp-head"><div><div class="pp-title">📻 ${fmtLatLon(probe.lat, probe.lon)}</div>`+
      `<div class="pp-meta">${toHM(curMin)} UTC · 估算可接收 <b>${probeResults.length}</b> 条</div></div>`+
      `<button class="pp-close" title="关闭">✕</button></div>`;
    if (!shown.length){
      h += '<div class="pp-empty">此时此地估计收不到当前筛选条件下的广播。<br>试试换个时间或位置。</div>';
    } else {
      h += '<div class="pp-list">';
      for (const {r, lv, dist} of shown){
        const bars = [1,2,3,4,5].map(i => `<i${i<=lv.n ? ` style="background:${lv.color}"` : ''}></i>`).join('');
        h += `<div class="pp-row"><span class="pp-bars" title="强度 ${lv.n}/5">${bars}</span>`+
          `<span class="pp-freq">${r.f}<small> kHz</small></span>`+
          `<span class="pp-main"><b>${r.brcname||r.brc||'—'}</b><small>${r.langname||r.lang||''} · ${r.s}–${r.e} · ${r.site||r.loc||''}</small></span>`+
          `<span class="pp-side"><span style="color:${lv.color}">${lv.name}</span><small>${r.admname||r.adm||''} · ${Math.round(dist).toLocaleString()} km</small></span></div>`;
      }
      if (probeResults.length > shown.length)
        h += `<div class="pp-more">… 另有 ${probeResults.length - shown.length} 条较弱信号</div>`;
      h += '</div>';
    }
    h += '<div class="pp-note">强度按发射功率、天线方向、距离和昼夜电离层粗略估算，仅供参考。拖动地图上的 📻 可换位置。</div>';
    probePanel.innerHTML = h;
    probePanel.hidden = false;
    probePanel.querySelector('.pp-close').onclick = clearProbe;
  }
  function clearProbe(){ probe = null; probeResults = []; probePanel.hidden = true; draw(); }

  // 画布坐标 → 经纬度
  function setProbeAt(mx, my){
    const W = cv.width/dpr, H = cv.height/dpr;
    probe = { lon: view.lon0 + (mx/W)*(view.lon1-view.lon0), lat: view.lat1 - (my/H)*(view.lat1-view.lat0) };
  }
  function hitProbe(mx, my){
    if (!probe) return false;
    const [px, py] = proj(probe.lon, probe.lat);
    return Math.hypot(mx - px, my - (py - 18)) < 16;
  }
  function startProbeDrag(mx, my){
    const [px, py] = proj(probe.lon, probe.lat);
    probeDrag = { dx: px - mx, dy: py - my };   // 记住抓取点与针尖的偏移，拖动时不跳
    hideTip();
  }
  function moveProbeDrag(mx, my){ setProbeAt(mx + probeDrag.dx, my + probeDrag.dy); draw(); }
  function endProbeDrag(){ probeDrag = null; updateProbe(); }

  function drawProbe(){
    if (!probe) return;
    const [px, py] = proj(probe.lon, probe.lat);
    ctx.save();
    if (!probeDrag){   // 连线到最强的 5 个发射台
      ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]); ctx.globalAlpha = 0.8;
      for (const {r, lv} of probeResults.slice(0, 5)){
        const [sx, sy] = proj(r.lon, r.lat);
        ctx.strokeStyle = lv.color;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(px, py); ctx.stroke();
      }
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    // 图钉：圆头 + 针尖指向接收点
    ctx.fillStyle = '#58a6ff'; ctx.strokeStyle = '#0f1419'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py - 20, 12, Math.PI*0.75, Math.PI*2.25); ctx.lineTo(px, py); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.font = '13px -apple-system,"Apple Color Emoji","Segoe UI Emoji",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('📻', px, py - 20);
    ctx.restore();
  }

  // 从右上角按钮拖出 📻（鼠标和触摸统一用 pointer 事件）；只是点一下则放到地图中央
  probeBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    const ghost = document.createElement('div');
    ghost.className = 'probe-ghost'; ghost.textContent = '📻';
    document.body.appendChild(ghost);
    const sx = e.clientX, sy = e.clientY;
    let moved = false;
    const move = ev => {
      if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) moved = true;
      ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
      ghost.classList.toggle('show', moved);
    };
    const end = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', end);
      window.removeEventListener('pointercancel', end);
      ghost.remove();
      if (ev.type === 'pointercancel') return;
      const b = cv.getBoundingClientRect();
      if (!moved) setProbeAt(b.width/2, b.height/2);
      else if (document.elementFromPoint(ev.clientX, ev.clientY) === cv) setProbeAt(ev.clientX - b.left, ev.clientY - b.top);
      else return;   // 没放到地图上
      hideTip(); updateProbe();
    };
    move(e);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  });

  return {
    build, draw, resize, renderLegend,
    get siteGroups(){ return siteGroups; },
    get probeResults(){ return probeResults; },
  };
})();

// ---- init ----
function init(){
  const n = nowUTC();
  if (thEl.value==='' || thEl.value==null) thEl.value = n.h;
  if (tmEl.value==='' || tmEl.value==null) tmEl.value = n.m;
  liveOnly = true;
  liveBtn.classList.add('on');
  liveBtn.textContent = '✓ 只看当前可收听';
  applyNowLock();
  showTab(true);   // 默认进入地图视图（内部会 resize + render）
}
init();
</script>
</body>
</html>
